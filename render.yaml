services:
  - type: worker
    name: atena-telegram-worker
    runtime: python
    plan: starter
    region: oregon
    buildCommand: python -m pip install --upgrade pip && python -m pip install -e .
    startCommand: python scripts/atena_telegram_chat.py --poll-timeout 25
    autoDeploy: true
    envVars:
      - key: ATENA_TELEGRAM_BOT_TOKEN
        sync: false
      - key: ATENA_TELEGRAM_CHAT_ID
        sync: false
      - key: ATENA_LOCAL_MODEL
        value: qwen2.5:3b-instruct
      - key: ATENA_ROOT
        value: /opt/render/project/src
      - key: ATENA_TELEGRAM_LOG_LEVEL
        value: INFO
      - key: ATENA_AUTONOMOUS_SOURCES_ONLY
        value: "1"
      - key: ATENA_SQLITE_REQUIRED
        value: "1"
      - key: ATENA_OLLAMA_CHAT_URL
        sync: false
