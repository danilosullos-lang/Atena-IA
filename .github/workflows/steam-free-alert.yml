name: Atena Steam free games alert

on:
  schedule:
    # GitHub Actions usa UTC; executa a cada 30 minutos.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atena-store-discount-alert
  cancel-in-progress: false

jobs:
  check-store-discounts:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout do código da main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Verificar descontos e promoções nas cinco lojas
        env:
          ATENA_TELEGRAM_BOT_TOKEN: ${{ secrets.ATENA_TELEGRAM_BOT_TOKEN }}
          ATENA_TELEGRAM_CHAT_ID: ${{ secrets.ATENA_TELEGRAM_CHAT_ID }}
          ATENA_MIN_DISCOUNT: "50"
          ATENA_MAX_STORE_ITEMS: "200"
        run: |
          python scripts/store_discount_alert.py \\
            --stores steam epic gog nuuvem humble \\
            --minimum-discount 50 \\
            --db atena_evolution/memory.sqlite3

      - name: Publicar deduplicação no SQLite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atena_evolution/memory.sqlite3
          if git diff --cached --quiet; then
            echo "Nenhuma nova promoção registrada."
            exit 0
          fi
          git commit -m "chore(atena): record multistore discount alerts"
          git push origin HEAD:atena/autoevolution
