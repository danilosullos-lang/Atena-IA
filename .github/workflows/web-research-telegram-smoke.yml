name: ATENA web research Telegram smoke

on:
  workflow_dispatch:
    inputs:
      question:
        description: "Pergunta atual para simular no Telegram"
        required: true
        default: "Quais são os próximos jogos do Santos e do Palmeiras?"
        type: string

permissions:
  contents: read

jobs:
  web-research-telegram-smoke:
    name: Pesquisa web e mensagem simulada
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install --upgrade pip requests beautifulsoup4

      - name: Executar pesquisa web e enviar simulação
        env:
          ATENA_TELEGRAM_BOT_TOKEN: ${{ secrets.ATENA_TELEGRAM_BOT_TOKEN }}
          ATENA_TELEGRAM_CHAT_ID: ${{ secrets.ATENA_TELEGRAM_CHAT_ID }}
          ATENA_WEB_SEARCH_PROVIDER: ${{ vars.ATENA_WEB_SEARCH_PROVIDER || 'tavily' }}
          ATENA_TAVILY_API_KEY: ${{ secrets.ATENA_TAVILY_API_KEY }}
          ATENA_GOOGLE_API_KEY: ${{ secrets.ATENA_GOOGLE_API_KEY }}
          ATENA_GOOGLE_CSE_ID: ${{ secrets.ATENA_GOOGLE_CSE_ID }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python scripts/web_research_telegram_smoke.py \
            --question "${{ inputs.question }}"
