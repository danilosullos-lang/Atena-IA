name: ATENA CI and controlled updates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_generated_state:
        description: "Executar a Atena e publicar somente o estado gerado permitido"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: atena-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes e smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Compilar módulos principais
        run: |
          python -m py_compile core/atena_launcher.py
          python -m py_compile main.py app.py

      - name: Diagnóstico da Atena
        env:
          ATENA_ROOT: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}
          ATENA_AUTO_ENDPOINT_SETUP: "false"
          ATENA_TRACING: "0"
          ATENA_PROFILING: "0"
        run: bash atena doctor

      - name: Suíte de testes
        env:
          ATENA_ROOT: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}
          ATENA_AUTO_ENDPOINT_SETUP: "false"
          ATENA_TRACING: "0"
          ATENA_PROFILING: "0"
          ATENA_CI_MODE: "true"
        run: python -m pytest -q

      - name: Smoke test autônomo
        env:
          ATENA_ROOT: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}
          ATENA_AUTO_ENDPOINT_SETUP: "false"
          ATENA_TRACING: "0"
          ATENA_PROFILING: "0"
          ATENA_CI_MODE: "true"
        run: bash atena --venv --auto

  publish-generated-state:
    name: Publicar estado gerado pela Atena
    if: github.event_name == 'workflow_dispatch' && inputs.publish_generated_state == true
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout da branch solicitada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Executar ciclo autônomo da Atena
        env:
          ATENA_ROOT: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}
          ATENA_AUTO_ENDPOINT_SETUP: "false"
          ATENA_TRACING: "0"
          ATENA_PROFILING: "0"
          ATENA_CI_MODE: "true"
        run: bash atena --venv --auto

      - name: Publicar somente estado permitido
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memoria_atena.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de estado para publicar."
            exit 0
          fi
          git commit -m "chore(atena): update generated state"
          git push origin HEAD:${{ github.ref_name }}
