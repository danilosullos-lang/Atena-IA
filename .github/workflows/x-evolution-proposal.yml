name: Atena X research proposal

on:
  schedule:
    # Varredura diária de propostas; não é o ciclo autônomo de memória.
    - cron: "20 03 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: atena-x-evolution-proposal
  cancel-in-progress: false

jobs:
  proposal:
    name: Gerar proposta segura de evolução via X
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install --upgrade requests

      - name: Coletar resultados e metadados públicos
        env:
          ATENA_X_BEARER_TOKEN: ${{ secrets.ATENA_X_BEARER_TOKEN }}
        run: PYTHONPATH="$GITHUB_WORKSPACE" python scripts/x_evolution_proposal.py

      - name: Criar Pull Request de proposta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="atena/x-proposal-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add atena_evolution/x_research/
          if git diff --cached --quiet; then
            echo "Nenhuma proposta nova foi gerada."
            exit 0
          fi
          git commit -m "research(atena): proposal from X signals"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "research(atena): proposta baseada em sinais do X" \
            --body "## Escopo\n\nEste PR contém apenas evidências e candidatos para análise. Nenhum código externo foi executado ou injetado.\n\n## Próxima etapa\n\nRevisar licença, fixar commit, executar sandbox e comparar benchmarks antes de qualquer alteração de código."
